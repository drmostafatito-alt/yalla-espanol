<svg class="fox" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 225" fill="none" role="img" aria-label="شخصية ثعلب أصلية بشال تركواز"><ellipse cx="93" cy="213" rx="54" ry="9" fill="#e9edef"/><g class="fox-body"><path d="M116 173c32 11 52-6 50-38-2-15-9-24-17-29-2 22-9 30-25 32Z" fill="#E78348"/><path d="M162 123c-2-7-7-13-13-17-1 13-4 21-10 26l23 10c3-7 3-13 0-19Z" fill="#FFF1D9"/><path d="m70 183-6 22h20l7-21m17-1 5 22h21l-12-26" fill="#513C44"/><path d="M60 201h25v9H53c0-5 3-9 7-9m54 0h19c7 0 11 4 11 9h-30Z" fill="#284C55"/><path d="M62 135c1-17 11-28 31-28s33 11 35 29l8 42c-7 22-75 20-82 0Z" fill="#ED985C"/><path d="M79 139c0-12 7-20 17-20s18 7 19 20l4 37c-8 9-36 8-43-2Z" fill="#FFF1D9"/><path d="M61 133c-4 17-9 28-18 36" stroke="#ED985C" stroke-width="18" stroke-linecap="round"/><path d="M123 132c15 6 21 3 25-13" stroke="#ED985C" stroke-width="17" stroke-linecap="round"/><path d="M146 122c-5-2-8-7-6-11 2-3 5-1 7 1-1-8 1-11 5-10 6 2 7 11 5 16-1 5-6 7-11 4" fill="#F5AF71"/>
<g class="fox-head"><path d="M46 64 42 17c0-8 8-10 13-5l30 29m29 0 31-31c5-4 11-1 10 6l-3 51" fill="#EB9457"/><path d="m51 25 4 35 20-14Z" fill="#9C5954"/><path d="m143 24-3 34-18-12Z" fill="#9C5954"/><path d="M49 57c10-16 27-23 49-23 24 0 44 11 51 30l7 28c5 32-20 46-55 45-39-1-66-17-61-45Z" fill="#F2A36B"/><path d="M41 83c9 3 26 4 42 18 6 5 17 8 21 7 5-1 10-6 17-12 10-9 23-11 34-12l1 14c1 26-24 40-53 39-34 0-61-15-63-36Z" fill="#FFF1D9"/><path d="M70 70c4-5 10-5 15-2m31-1c5-4 11-3 14 2" stroke="#6F4646" stroke-width="5" stroke-linecap="round"/><g class="fox-eyes"><ellipse cx="80" cy="84" rx="10" ry="14" fill="white"/><ellipse cx="121" cy="83" rx="10" ry="14" fill="white"/><ellipse cx="84" cy="85" rx="5" ry="8" fill="#3A3546"/><ellipse cx="124" cy="84" rx="5" ry="8" fill="#3A3546"/><circle cx="86" cy="82" r="2" fill="white"/><circle cx="126" cy="81" r="2" fill="white"/></g><path d="M96 101c4-3 13-3 17 0 0 7-5 11-9 10-5-1-8-5-8-10" fill="#493642"/><path class="mouth" d="M95 118q11 13 24-1" stroke="#6F4646" stroke-width="4" stroke-linecap="round"/><path d="m50 94 8 3m82-3 7-3" stroke="#E88863" stroke-width="5" stroke-linecap="round"/></g><path d="M65 126c14 9 40 11 62-1l4 15c-25 14-51 11-70 0Z" fill="#29A9AF"/><path d="m114 140-1 30 15-8 4-21Z" fill="#198D98"/><path d="m113 152 15-4" stroke="#57C7C8" stroke-width="4"/></g><g id="talk"/><g id="correct"/><g id="retry"/><g id="complete"/><style>
svg:has(#talk:target) .mouth{transform-box:fill-box;transform-origin:center;animation:spoken .18s ease-in-out infinite alternate;fill:#6F4646}
svg:has(#correct:target) .fox-head{transform-origin:90px 110px;animation:confirm .4s ease-out 1}
svg:has(#retry:target) .fox-head{transform-origin:90px 110px;transform:rotate(-5deg)}
svg:has(#complete:target) .fox-body{transform-origin:90px 200px;animation:celebrate .65s ease-out 1}
@keyframes spoken{from{transform:scaleY(.4)}to{transform:scaleY(1.65)}}
@keyframes confirm{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes celebrate{0%,100%{transform:translateY(0)}45%{transform:translateY(-9px) rotate(-4deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></svg>