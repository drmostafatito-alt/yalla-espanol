<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img" aria-label="الجو بين شمس ومطر"><style>.arm-wave{transform-box:fill-box;transform-origin:70% 20%;animation:arm-wave 3.5s ease-in-out infinite}.key-glow{animation:key-glow 2.4s ease-in-out infinite}.pin-float{animation:pin-float 2.8s ease-in-out infinite}.bead{animation:bead 3.8s ease-in-out infinite}@keyframes arm-wave{50%{transform:rotate(-9deg)}}@keyframes key-glow{50%{opacity:.35}}@keyframes pin-float{50%{transform:translateY(-5px)}}@keyframes bead{50%{transform:translateX(3px)}}.scene-props{animation:scene-idle 4s ease-in-out infinite;transform-origin:130px 122px}.steam{animation:steam 2.2s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}.rain{animation:rain 1.4s ease-in-out infinite}.ride{animation:ride 2.8s ease-in-out infinite}.sun{animation:sun 8s linear infinite;transform-origin:33px 32px}.flicker{animation:flicker .7s ease-in-out infinite alternate}@keyframes scene-idle{50%{transform:translateY(-2px)}}@keyframes steam{0%{transform:translateY(3px);opacity:.3}55%{opacity:1}100%{transform:translateY(-6px);opacity:.2}}@keyframes sway{50%{transform:rotate(-5deg)}}@keyframes rain{50%{transform:translateY(3px)}}@keyframes ride{50%{transform:translateX(5px)}}@keyframes sun{to{transform:rotate(360deg)}}@keyframes flicker{to{transform:scaleY(.85);opacity:.7}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="130" cy="134" rx="106" ry="10" fill="#B7D9DC" opacity=".3"/><g class="scene-props"><g transform="translate(65 27) scale(1.25)"><g class=""><g transform="translate(0 0) scale(0.9)"><g class=""><g transform="translate(0 0) scale(1)"><g class="sun"><circle cx="33" cy="32" r="18" fill="#F8C36F" stroke="none" stroke-width="3"/><path d="M33 3v6" fill="none" stroke="#EF9A61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M33 55v7" fill="none" stroke="#EF9A61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M3 32h7" fill="none" stroke="#EF9A61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M56 32h7" fill="none" stroke="#EF9A61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M11 10l5 5" fill="none" stroke="#EF9A61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M52 52l5 5" fill="none" stroke="#EF9A61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M10 54l5-5" fill="none" stroke="#EF9A61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M51 13l5-5" fill="none" stroke="#EF9A61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></g><g transform="translate(35 35) scale(0.8)"><g class="rain"><path d="M8 34q-15-15 2-24 6-20 26-8 20-2 23 15 22 12 1 24H8Z" fill="#FFFFFF" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="m16 48-5 10m21-10-5 10m21-10-5 10" fill="none" stroke="#80C3D5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></g></g></svg>