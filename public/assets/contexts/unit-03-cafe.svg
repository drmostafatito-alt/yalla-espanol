<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img" aria-label="كافيه ومشروبات على الكاونتر"><style>.arm-wave{transform-box:fill-box;transform-origin:70% 20%;animation:arm-wave 3.5s ease-in-out infinite}.key-glow{animation:key-glow 2.4s ease-in-out infinite}.pin-float{animation:pin-float 2.8s ease-in-out infinite}.bead{animation:bead 3.8s ease-in-out infinite}@keyframes arm-wave{50%{transform:rotate(-9deg)}}@keyframes key-glow{50%{opacity:.35}}@keyframes pin-float{50%{transform:translateY(-5px)}}@keyframes bead{50%{transform:translateX(3px)}}.scene-props{animation:scene-idle 4s ease-in-out infinite;transform-origin:130px 122px}.steam{animation:steam 2.2s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}.rain{animation:rain 1.4s ease-in-out infinite}.ride{animation:ride 2.8s ease-in-out infinite}.sun{animation:sun 8s linear infinite;transform-origin:33px 32px}.flicker{animation:flicker .7s ease-in-out infinite alternate}@keyframes scene-idle{50%{transform:translateY(-2px)}}@keyframes steam{0%{transform:translateY(3px);opacity:.3}55%{opacity:1}100%{transform:translateY(-6px);opacity:.2}}@keyframes sway{50%{transform:rotate(-5deg)}}@keyframes rain{50%{transform:translateY(3px)}}@keyframes ride{50%{transform:translateX(5px)}}@keyframes sun{to{transform:rotate(360deg)}}@keyframes flicker{to{transform:scaleY(.85);opacity:.7}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="130" cy="134" rx="106" ry="10" fill="#B7D9DC" opacity=".3"/><g class="scene-props"><g transform="translate(26 42) scale(1.04)"><g class=""><path d="M9 24h38v23q0 18-19 18T9 47Z" fill="#FFFFFF" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M47 31h7q16 0 7 17-4 5-14 3" fill="none" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M3 69h51" fill="none" stroke="#35AFB6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class=""/><g transform="translate(0 0) scale(1)"><g class="steam"><path d="M18 13q-6-6 0-12m11 12q-6-6 0-12m11 12q-6-6 0-12" fill="none" stroke="#EF9A61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></g><g transform="translate(140 45) scale(0.95)"><g class=""><g transform="translate(0 -8) scale(0.8)"><g class=""><rect x="-7" y="28" width="79" height="42" rx="5" fill="#FFF0D8" stroke="#41616A" stroke-width="3"/><path d="M-14 29h92" fill="none" stroke="#EF9A61" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M9 24h38v23q0 18-19 18T9 47Z" fill="#FFFFFF" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M47 31h7q16 0 7 17-4 5-14 3" fill="none" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M3 69h51" fill="none" stroke="#35AFB6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class=""/><g transform="translate(0 0) scale(1)"><g class="steam"><path d="M18 13q-6-6 0-12m11 12q-6-6 0-12m11 12q-6-6 0-12" fill="none" stroke="#EF9A61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></g></g></g></g></svg>