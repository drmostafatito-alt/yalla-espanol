<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img" aria-label="وزن وكمية مشروب"><style>.arm-wave{transform-box:fill-box;transform-origin:70% 20%;animation:arm-wave 3.5s ease-in-out infinite}.key-glow{animation:key-glow 2.4s ease-in-out infinite}.pin-float{animation:pin-float 2.8s ease-in-out infinite}.bead{animation:bead 3.8s ease-in-out infinite}@keyframes arm-wave{50%{transform:rotate(-9deg)}}@keyframes key-glow{50%{opacity:.35}}@keyframes pin-float{50%{transform:translateY(-5px)}}@keyframes bead{50%{transform:translateX(3px)}}.scene-props{animation:scene-idle 4s ease-in-out infinite;transform-origin:130px 122px}.steam{animation:steam 2.2s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}.rain{animation:rain 1.4s ease-in-out infinite}.ride{animation:ride 2.8s ease-in-out infinite}.sun{animation:sun 8s linear infinite;transform-origin:33px 32px}.flicker{animation:flicker .7s ease-in-out infinite alternate}@keyframes scene-idle{50%{transform:translateY(-2px)}}@keyframes steam{0%{transform:translateY(3px);opacity:.3}55%{opacity:1}100%{transform:translateY(-6px);opacity:.2}}@keyframes sway{50%{transform:rotate(-5deg)}}@keyframes rain{50%{transform:translateY(3px)}}@keyframes ride{50%{transform:translateX(5px)}}@keyframes sun{to{transform:rotate(360deg)}}@keyframes flicker{to{transform:scaleY(.85);opacity:.7}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="130" cy="134" rx="106" ry="10" fill="#B7D9DC" opacity=".3"/><g class="scene-props"><g transform="translate(26 42) scale(1.04)"><g class=""><g transform="translate(0 0) scale(1)"><g class="sway"><rect x="7" y="49" width="60" height="21" rx="5" fill="#35AFB6" stroke="#41616A" stroke-width="3"/><path d="M37 47V19M7 19h60M9 8v11m56-11v11" fill="none" stroke="#41616A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="m5 20-10 18h27L12 20m48 0L47 38h29L64 20" fill="#FFF0D8" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><circle cx="37" cy="57" r="6" fill="#FFFFFF" stroke="none" stroke-width="3"/></g></g></g></g><g transform="translate(140 45) scale(0.95)"><g class=""><rect x="16" y="0" width="21" height="10" rx="2" fill="#35AFB6" stroke="#41616A" stroke-width="3"/><path d="M17 11v7L7 30v37q0 8 9 8h24q8 0 8-8V30L36 18v-7Z" fill="#80C3D5" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="10" y="38" width="35" height="17" rx="3" fill="#FFF0D8" stroke="#41616A" stroke-width="3"/></g></g></g></svg>