<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img" aria-label="وصف الناس والحاجات والملكية"><style>.arm-wave{transform-box:fill-box;transform-origin:70% 20%;animation:arm-wave 3.5s ease-in-out infinite}.key-glow{animation:key-glow 2.4s ease-in-out infinite}.pin-float{animation:pin-float 2.8s ease-in-out infinite}.bead{animation:bead 3.8s ease-in-out infinite}@keyframes arm-wave{50%{transform:rotate(-9deg)}}@keyframes key-glow{50%{opacity:.35}}@keyframes pin-float{50%{transform:translateY(-5px)}}@keyframes bead{50%{transform:translateX(3px)}}.scene-props{animation:scene-idle 4s ease-in-out infinite;transform-origin:130px 122px}.steam{animation:steam 2.2s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}.rain{animation:rain 1.4s ease-in-out infinite}.ride{animation:ride 2.8s ease-in-out infinite}.sun{animation:sun 8s linear infinite;transform-origin:33px 32px}.flicker{animation:flicker .7s ease-in-out infinite alternate}@keyframes scene-idle{50%{transform:translateY(-2px)}}@keyframes steam{0%{transform:translateY(3px);opacity:.3}55%{opacity:1}100%{transform:translateY(-6px);opacity:.2}}@keyframes sway{50%{transform:rotate(-5deg)}}@keyframes rain{50%{transform:translateY(3px)}}@keyframes ride{50%{transform:translateX(5px)}}@keyframes sun{to{transform:rotate(360deg)}}@keyframes flicker{to{transform:scaleY(.85);opacity:.7}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="130" cy="134" rx="106" ry="10" fill="#B7D9DC" opacity=".3"/><g class="scene-props"><g transform="translate(26 42) scale(1.04)"><g class=""><g transform="translate(0 0) scale(1)"><g class=""><circle cx="30" cy="14" r="10" fill="#F4BE91" stroke="none" stroke-width="3"/><path d="M16 57V41c0-17 28-17 28 0v16" fill="#35AFB6" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M22 57v8m16-8v8" fill="none" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M18 39 8 49m34-10 10-11" fill="none" stroke="#35AFB6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="arm-wave"/><path d="M22 10q8-12 17 1" fill="none" stroke="#70535C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></g><g transform="translate(140 45) scale(0.95)"><g class=""><g transform="translate(0 13) scale(0.8)"><g class=""><circle cx="30" cy="14" r="10" fill="#F4BE91" stroke="none" stroke-width="3"/><path d="M16 57V41c0-17 28-17 28 0v16" fill="#D28FA7" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M22 57v8m16-8v8" fill="none" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M18 39 8 49m34-10 10-11" fill="none" stroke="#D28FA7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="arm-wave"/><path d="M22 10q8-12 17 1" fill="none" stroke="#70535C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g transform="translate(42 40) scale(0.5)"><g class=""><path d="M1 12q17-6 30 2 14-8 30-2v43q-17-6-30 1-13-7-30-1Z" fill="#FFFFFF" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M31 14v42" fill="none" stroke="#35AFB6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M8 23h14m-14 9h14m-14 9h14m18-18h13m-13 9h13m-13 9h13" fill="none" stroke="#C7DCE1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></g></g></svg>