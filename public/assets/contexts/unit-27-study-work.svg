<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img" aria-label="شغل ودراسة على مكتب"><style>.arm-wave{transform-box:fill-box;transform-origin:70% 20%;animation:arm-wave 3.5s ease-in-out infinite}.key-glow{animation:key-glow 2.4s ease-in-out infinite}.pin-float{animation:pin-float 2.8s ease-in-out infinite}.bead{animation:bead 3.8s ease-in-out infinite}@keyframes arm-wave{50%{transform:rotate(-9deg)}}@keyframes key-glow{50%{opacity:.35}}@keyframes pin-float{50%{transform:translateY(-5px)}}@keyframes bead{50%{transform:translateX(3px)}}.scene-props{animation:scene-idle 4s ease-in-out infinite;transform-origin:130px 122px}.steam{animation:steam 2.2s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}.rain{animation:rain 1.4s ease-in-out infinite}.ride{animation:ride 2.8s ease-in-out infinite}.sun{animation:sun 8s linear infinite;transform-origin:33px 32px}.flicker{animation:flicker .7s ease-in-out infinite alternate}@keyframes scene-idle{50%{transform:translateY(-2px)}}@keyframes steam{0%{transform:translateY(3px);opacity:.3}55%{opacity:1}100%{transform:translateY(-6px);opacity:.2}}@keyframes sway{50%{transform:rotate(-5deg)}}@keyframes rain{50%{transform:translateY(3px)}}@keyframes ride{50%{transform:translateX(5px)}}@keyframes sun{to{transform:rotate(360deg)}}@keyframes flicker{to{transform:scaleY(.85);opacity:.7}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="130" cy="134" rx="106" ry="10" fill="#B7D9DC" opacity=".3"/><g class="scene-props"><g transform="translate(26 42) scale(1.04)"><g class=""><g transform="translate(0 0) scale(1)"><g class="key-glow"><rect x="3" y="3" width="63" height="44" rx="5" fill="#35AFB6" stroke="#41616A" stroke-width="3"/><rect x="9" y="9" width="51" height="31" rx="2" fill="#FFFFFF" stroke="#41616A" stroke-width="3"/><path d="M-3 48h75l-6 9H3Z" fill="#FFF0D8" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M18 20h19m-19 8h32" fill="none" stroke="#B8D8DC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></g><g transform="translate(140 45) scale(0.95)"><g class=""><g transform="translate(0 0) scale(1)"><g class="sway"><path d="M1 12q17-6 30 2 14-8 30-2v43q-17-6-30 1-13-7-30-1Z" fill="#FFFFFF" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M31 14v42" fill="none" stroke="#35AFB6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M8 23h14m-14 9h14m-14 9h14m18-18h13m-13 9h13m-13 9h13" fill="none" stroke="#C7DCE1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></g></g></svg>