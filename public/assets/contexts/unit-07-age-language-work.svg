<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img" aria-label="تعريف بالنفس ولغات وشغل"><style>.arm-wave{transform-box:fill-box;transform-origin:70% 20%;animation:arm-wave 3.5s ease-in-out infinite}.key-glow{animation:key-glow 2.4s ease-in-out infinite}.pin-float{animation:pin-float 2.8s ease-in-out infinite}.bead{animation:bead 3.8s ease-in-out infinite}@keyframes arm-wave{50%{transform:rotate(-9deg)}}@keyframes key-glow{50%{opacity:.35}}@keyframes pin-float{50%{transform:translateY(-5px)}}@keyframes bead{50%{transform:translateX(3px)}}.scene-props{animation:scene-idle 4s ease-in-out infinite;transform-origin:130px 122px}.steam{animation:steam 2.2s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}.rain{animation:rain 1.4s ease-in-out infinite}.ride{animation:ride 2.8s ease-in-out infinite}.sun{animation:sun 8s linear infinite;transform-origin:33px 32px}.flicker{animation:flicker .7s ease-in-out infinite alternate}@keyframes scene-idle{50%{transform:translateY(-2px)}}@keyframes steam{0%{transform:translateY(3px);opacity:.3}55%{opacity:1}100%{transform:translateY(-6px);opacity:.2}}@keyframes sway{50%{transform:rotate(-5deg)}}@keyframes rain{50%{transform:translateY(3px)}}@keyframes ride{50%{transform:translateX(5px)}}@keyframes sun{to{transform:rotate(360deg)}}@keyframes flicker{to{transform:scaleY(.85);opacity:.7}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="130" cy="134" rx="106" ry="10" fill="#B7D9DC" opacity=".3"/><g class="scene-props"><g transform="translate(26 42) scale(1.04)"><g class=""><g transform="translate(0 0) scale(1)"><g class="sway"><rect x="0" y="0" width="83" height="56" rx="5" fill="#FFFFFF" stroke="#41616A" stroke-width="3"/><circle cx="20" cy="20" r="9" fill="#EF9A61" stroke="none" stroke-width="3"/><path d="M9 42q0-20 23-8l4 8Z" fill="#35AFB6" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M45 17h26m-26 12h26m-26 12h16" fill="none" stroke="#ABCBD1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></g><g transform="translate(140 45) scale(0.95)"><g class=""><g transform="translate(0 0) scale(0.85)"><g class=""><circle cx="33" cy="33" r="30" fill="#80C3D5" stroke="#41616A" stroke-width="3"/><path d="M4 32h58M33 3q-30 30 0 60 30-30 0-60ZM10 16q23 13 46 0M9 49q25-13 47 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g transform="translate(34 38) scale(0.5)"><g class=""><rect x="5" y="18" width="56" height="48" rx="5" fill="#EF9A61" stroke="#41616A" stroke-width="3"/><path d="M19 19v-9q0-10 14-10t14 10v9" fill="none" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M9 36q25 11 49 0" fill="none" stroke="#BB6E43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="29" y="32" width="8" height="13" rx="2" fill="#FFF0D8" stroke="#41616A" stroke-width="3"/></g></g></g></g></g></svg>