<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img" aria-label="محل وخدمات في الشارع"><style>.arm-wave{transform-box:fill-box;transform-origin:70% 20%;animation:arm-wave 3.5s ease-in-out infinite}.key-glow{animation:key-glow 2.4s ease-in-out infinite}.pin-float{animation:pin-float 2.8s ease-in-out infinite}.bead{animation:bead 3.8s ease-in-out infinite}@keyframes arm-wave{50%{transform:rotate(-9deg)}}@keyframes key-glow{50%{opacity:.35}}@keyframes pin-float{50%{transform:translateY(-5px)}}@keyframes bead{50%{transform:translateX(3px)}}.scene-props{animation:scene-idle 4s ease-in-out infinite;transform-origin:130px 122px}.steam{animation:steam 2.2s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}.rain{animation:rain 1.4s ease-in-out infinite}.ride{animation:ride 2.8s ease-in-out infinite}.sun{animation:sun 8s linear infinite;transform-origin:33px 32px}.flicker{animation:flicker .7s ease-in-out infinite alternate}@keyframes scene-idle{50%{transform:translateY(-2px)}}@keyframes steam{0%{transform:translateY(3px);opacity:.3}55%{opacity:1}100%{transform:translateY(-6px);opacity:.2}}@keyframes sway{50%{transform:rotate(-5deg)}}@keyframes rain{50%{transform:translateY(3px)}}@keyframes ride{50%{transform:translateX(5px)}}@keyframes sun{to{transform:rotate(360deg)}}@keyframes flicker{to{transform:scaleY(.85);opacity:.7}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="130" cy="134" rx="106" ry="10" fill="#B7D9DC" opacity=".3"/><g class="scene-props"><g transform="translate(26 42) scale(1.04)"><g class=""><rect x="4" y="23" width="64" height="46" rx="5" fill="#FFF0D8" stroke="#41616A" stroke-width="3"/><path d="M0 23 10 3h51l12 20Z" fill="#EF9A61" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M18 5 14 23m22-18v18M54 5l5 18" fill="none" stroke="#FFF0D8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class=""/><rect x="14" y="37" width="18" height="17" rx="2" fill="#FFFFFF" stroke="#41616A" stroke-width="3"/><rect x="42" y="36" width="16" height="33" rx="1" fill="#35AFB6" stroke="#41616A" stroke-width="3"/></g></g><g transform="translate(140 45) scale(0.95)"><g class=""><g transform="translate(0 0) scale(1)"><g class="pin-float"><path d="M29 65S3 40 3 25a26 26 0 0 1 52 0C55 40 29 65 29 65Z" fill="#35AFB6" stroke="#41616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class=""/><circle cx="29" cy="25" r="10" fill="#FFFFFF" stroke="none" stroke-width="3"/></g></g></g></g></g></svg>