<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 225"><ellipse cx="89" cy="214" rx="48" ry="8" fill="#e9edef"/><path d="m68 174-6 32h20l7-27 10 27h22l-10-33" fill="#3e535c"/><path d="M61 201h22v11H51c0-6 4-11 10-11m39 0h20c8 0 13 4 13 11h-33Z" fill="#304550"/><path d="M44 73C39 34 60 15 92 17c35 1 48 22 45 61l8 51-30 10H62l-29-12Z" fill="#593E48"/><path d="M60 118c-12 16-14 37-18 54" fill="none" stroke="#ad72ba" stroke-width="19" stroke-linecap="round"/><path d="M120 122c13 20 24 20 31 7" fill="none" stroke="#ad72ba" stroke-width="18" stroke-linecap="round"/><path d="M148 132c-9-6-4-17 2-19 4-1 8 4 7 9 6 1 4 10-2 13" fill="#f7b684"/><path d="M63 116c12-9 44-9 56 2l7 66c-19 10-49 9-68-1Z" fill="#ad72ba"/><path d="M80 109h22v18c-7 8-15 7-22 0Z" fill="#eaa375"/><rect x="51" y="43" width="80" height="75" rx="32" fill="#f7bc8d"/><path d="M51 63c-3-28 15-40 41-40 23 0 40 13 40 33-21 1-33-4-49-14-7 11-18 18-32 21" fill="#593e48"/><ellipse class="eye" cx="77" cy="76" rx="9" ry="12" fill="white"/><ellipse class="eye" cx="109" cy="76" rx="9" ry="12" fill="white"/><ellipse cx="80" cy="77" rx="4" ry="7" fill="#493944"/><ellipse cx="112" cy="77" rx="4" ry="7" fill="#493944"/><path d="M69 60q7-4 14-1m19 0q7-5 14 0" stroke="#67464a" stroke-width="4" fill="none" stroke-linecap="round"/><path class="mouth" d="M82 97q11 12 23-1" fill="white" stroke="#b87565" stroke-width="3" stroke-linecap="round"/><path d="M61 90h7m51 0h7" stroke="#ed9e7c" stroke-width="5" stroke-linecap="round"/><g id="talk"/><g id="correct"/><g id="retry"/><g id="complete"/><style>
svg:has(#talk:target) .mouth{transform-box:fill-box;transform-origin:center;animation:spoken .18s ease-in-out infinite alternate;fill:#6F4646}
svg:has(#correct:target) .fox-head{transform-origin:90px 110px;animation:confirm .4s ease-out 1}
svg:has(#retry:target) .fox-head{transform-origin:90px 110px;transform:rotate(-5deg)}
svg:has(#complete:target) .fox-body{transform-origin:90px 200px;animation:celebrate .65s ease-out 1}
@keyframes spoken{from{transform:scaleY(.4)}to{transform:scaleY(1.65)}}
@keyframes confirm{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes celebrate{0%,100%{transform:translateY(0)}45%{transform:translateY(-9px) rotate(-4deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></svg>